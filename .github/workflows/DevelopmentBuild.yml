name: DevelopmentBuild

on:
  push:
    branches:
      - master    # ← ここを追加（または develop を master に変更）

env:
  # ソリューションのパス
  SOLUTION_FILE_PATH: CG2_Setup.sln
  # Development は Releaseベースでビルド
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore NuGet packages (if any)
        run: nuget restore "${{ env.SOLUTION_FILE_PATH }}" || echo "No NuGet packages to restore"

      - name: Build solution
        run: |
          echo "Building Development (Release-based) version on master..."
          msbuild "${{ env.SOLUTION_FILE_PATH }}" /p:Platform=x64 /p:Configuration=${{ env.CONFIGURATION }} /m /verbosity:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevelopmentBuild
          path: |
            **/x64/${{ env.CONFIGURATION }}/*.exe
            **/x64/${{ env.CONFIGURATION }}/*.dll
